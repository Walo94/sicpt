<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error - SICP Hats</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" th:href="@{/css/login.css}" />
  </head>
  <body class="login-body">
    <main class="login-card text-center">
      <i
        class="fas fa-triangle-exclamation login-logo"
        style="color: #f4b400"
      ></i>
      <h1 class="h2 mt-2" th:text="${status}">Error</h1>
      <p class="text-muted" th:switch="${status}">
        <span th:case="403"
          >No tienes permiso para acceder a este recurso.</span
        >
        <span th:case="404">La página que buscas no existe.</span>
        <span th:case="*">Ocurrió un error inesperado. Intenta de nuevo.</span>
      </p>
      <a th:href="@{/}" class="btn btn-login"
        ><i class="fas fa-home me-1"></i> Ir al inicio</a
      >
    </main>
  </body>
</html>
