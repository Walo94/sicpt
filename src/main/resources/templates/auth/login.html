<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión - SICP Hats</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" th:href="@{/css/login.css}" />
  </head>
  <body class="login-body">
    <div class="login-shell">
      <!-- ===== Panel de marca ===== -->
      <aside class="login-brand">
        <div class="brand-center">
          <div class="sicp-logo" aria-label="SICP">
            <span class="sicp-letter">S</span>
            <span class="sicp-letter">I</span>
            <span class="sicp-letter">C</span>
            <span class="sicp-letter sicp-letter-accent">P</span>
          </div>
          <div class="sicp-bar"></div>
          <p class="sicp-expansion">
            Sistema Integral de Control de Producción
          </p>
        </div>
      </aside>

      <!-- ===== Formulario ===== -->
      <main class="login-card">
        <div class="login-heading">
          <h2>Iniciar sesión</h2>
          <p>Ingresa tus credenciales para continuar</p>
        </div>

        <form
          th:action="@{/login}"
          method="post"
          id="formLogin"
          class="login-form"
          novalidate
        >
          <div class="alert alert-danger py-2 small" th:if="${param.error}">
            <i class="fas fa-exclamation-circle me-1"></i> Usuario o contraseña
            incorrectos.
          </div>
          <div class="alert alert-success py-2 small" th:if="${param.logout}">
            <i class="fas fa-check-circle me-1"></i> Sesión cerrada
            correctamente.
          </div>

          <label for="username" class="form-label">Usuario</label>
          <div class="input-group mb-3">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              placeholder="Tu usuario"
              required
              autofocus
              autocomplete="username"
            />
          </div>

          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group mb-4">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            />
            <button
              class="btn btn-outline-secondary"
              type="button"
              id="btnVerPassword"
              title="Mostrar/ocultar"
            >
              <i class="fas fa-eye"></i>
            </button>
          </div>

          <button type="submit" class="btn btn-login w-100" id="btnLogin">
            <i class="fas fa-sign-in-alt me-1"></i> Entrar
          </button>
        </form>

        <div class="login-footer">TOMBSTONE HATS</div>
      </main>
    </div>

    <script th:src="@{/js/login.js}"></script>
  </body>
</html>
