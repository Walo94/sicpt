<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <th:block th:fragment="formulario">
        <div class="modal-header modal-header-custom">
            <h5 class="modal-title">
                <i class="fas fa-shirt me-2"></i>
                <span th:text="${form.id == null} ? 'Nuevo Modelo' : 'Editar Modelo'">Nuevo Modelo</span>
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <!-- IMPORTANTE: hx-encoding="multipart/form-data" para subir la imagen -->
        <form th:object="${form}"
            th:attr="hx-post=${form.id == null} ? @{/diseno/modelos} : @{/diseno/modelos/{id}(id=${form.id})}"
            hx-target="#modalContent" hx-swap="innerHTML" hx-include="#buscador, #estadoTabla" 
            hx-encoding="multipart/form-data" novalidate autocomplete="off" id="formModelo">
            
            <div class="modal-body" style="max-height: calc(100vh - 200px); overflow-y: auto;">
                
                <div class="accordion" id="accordionModelo">
                    <!-- 1. DATOS GENERALES -->
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseGenerales">
                                <i class="fas fa-info-circle me-2"></i> Datos Generales
                            </button>
                        </h2>
                        <div id="collapseGenerales" class="accordion-collapse collapse show" data-bs-parent="#accordionModelo">
                            <div class="accordion-body">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label">Código <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control text-uppercase" th:field="*{codigoModelo}" th:errorclass="is-invalid" maxlength="50" />
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('codigoModelo')}" th:errors="*{codigoModelo}"></div>
                                    </div>
                                    <div class="col-md-8">
                                        <label class="form-label">Descripción <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" th:field="*{descripcion}" th:errorclass="is-invalid" maxlength="150" />
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label">Marca <span class="text-danger">*</span></label>
                                        <div class="combo-busqueda" id="marcaCombo" data-url="/diseno/marcas/opciones">
                                            <input type="text" class="form-control" id="marcaBuscar" autocomplete="off" th:value="${form.marcaTexto}" />
                                            <input type="hidden" th:field="*{marcaId}" id="marcaId" />
                                            <div class="combo-busqueda-dropdown" id="marcaDropdown"></div>
                                        </div>
                                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('marcaId')}" th:errors="*{marcaId}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Línea <span class="text-danger">*</span></label>
                                        <div class="combo-busqueda" id="lineaCombo" data-url="/diseno/lineas/opciones">
                                            <input type="text" class="form-control" id="lineaBuscar" autocomplete="off" th:value="${form.lineaTexto}" />
                                            <input type="hidden" th:field="*{lineaId}" id="lineaId" />
                                            <div class="combo-busqueda-dropdown" id="lineaDropdown"></div>
                                        </div>
                                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('lineaId')}" th:errors="*{lineaId}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Horma <span class="text-danger">*</span></label>
                                        <div class="combo-busqueda" id="hormaCombo" data-url="/diseno/hormas/opciones">
                                            <input type="text" class="form-control" id="hormaBuscar" autocomplete="off" th:value="${form.hormaTexto}" />
                                            <input type="hidden" th:field="*{hormaId}" id="hormaId" />
                                            <div class="combo-busqueda-dropdown" id="hormaDropdown"></div>
                                        </div>
                                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('hormaId')}" th:errors="*{hormaId}"></div>
                                    </div>

                                    <div class="col-md-4">
                                        <label class="form-label">Tallas Disponibles</label>
                                        <input type="text" class="form-control" th:field="*{tallasDisponibles}" placeholder="Ej. 37-43" maxlength="50"/>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Estilo</label>
                                        <input type="text" class="form-control" th:field="*{estilo}" placeholder="Ej. Oficina, Casual" maxlength="100"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 2. MATERIALES Y PARTES -->
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseMateriales">
                                <i class="fas fa-layer-group me-2"></i> Materiales y Partes
                            </button>
                        </h2>
                        <div id="collapseMateriales" class="accordion-collapse collapse" data-bs-parent="#accordionModelo">
                            <div class="accordion-body">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label class="form-label">Material de Corte</label>
                                        <input type="text" class="form-control" th:field="*{materialCorte}" placeholder="Ej. Cuero" maxlength="100"/>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Forro</label>
                                        <input type="text" class="form-control" th:field="*{forro}" placeholder="Ej. Tela" maxlength="100"/>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Plantilla</label>
                                        <input type="text" class="form-control" th:field="*{plantilla}" placeholder="Ej. Sintético" maxlength="100"/>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Suela</label>
                                        <input type="text" class="form-control" th:field="*{suela}" placeholder="Ej. Caucho" maxlength="100"/>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Color Principal</label>
                                        <input type="text" class="form-control" th:field="*{colorPrincipal}" placeholder="Ej. Negro" maxlength="100"/>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Cordones</label>
                                        <input type="text" class="form-control" th:field="*{cordones}" placeholder="Ej. Redondos negros" maxlength="150"/>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Contrafuerte</label>
                                        <input type="text" class="form-control" th:field="*{contrafuerte}" placeholder="Ej. Tela no tejida" maxlength="150"/>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Cuello</label>
                                        <input type="text" class="form-control" th:field="*{cuello}" placeholder="Ej. Espumado" maxlength="100"/>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Lengüeta</label>
                                        <input type="text" class="form-control" th:field="*{lengueta}" placeholder="Ej. Cuero" maxlength="100"/>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Ojales</label>
                                        <input type="text" class="form-control" th:field="*{ojales}" placeholder="Ej. Perforados con troquel" maxlength="100"/>
                                    </div>
                                    <div class="col-md-8">
                                        <label class="form-label">Vida Útil</label>
                                        <input type="text" class="form-control" th:field="*{vidaUtil}" placeholder="Ej. 6 meses para trabajo de oficina" maxlength="150"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 3. RECOMENDACIONES Y TEXTOS -->
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTextos">
                                <i class="fas fa-clipboard-list me-2"></i> Observaciones y Recomendaciones
                            </button>
                        </h2>
                        <div id="collapseTextos" class="accordion-collapse collapse" data-bs-parent="#accordionModelo">
                            <div class="accordion-body">
                                <div class="row g-3">
                                    <div class="col-12">
                                        <label class="form-label">Observaciones</label>
                                        <textarea class="form-control" th:field="*{observaciones}" rows="2"></textarea>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Recomendaciones de Limpieza</label>
                                        <textarea class="form-control" th:field="*{recomendaciones}" rows="2"></textarea>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Almacenamiento</label>
                                        <textarea class="form-control" th:field="*{almacenamiento}" rows="2"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 4. IMAGEN -->
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseImagen">
                                <i class="fas fa-image me-2"></i> Imagen del Modelo
                            </button>
                        </h2>
                        <div id="collapseImagen" class="accordion-collapse collapse" data-bs-parent="#accordionModelo">
                            <div class="accordion-body">
                                <div class="mb-3" th:if="${form.imagenUrlActual != null}">
                                    <label class="form-label d-block">Imagen Actual:</label>
                                    <img th:src="@{${form.imagenUrlActual}}" alt="Imagen actual" class="img-thumbnail" style="max-height: 150px;">
                                </div>
                                <div>
                                    <label class="form-label">Subir Nueva Imagen (JPG/PNG)</label>
                                    <input class="form-control" type="file" th:field="*{imagenFile}" accept="image/*">
                                </div>
                            </div>
                        </div>
                    </div>

                </div> <!-- Fin Acordeón -->
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">
                    <i class="fas fa-times me-1"></i> Cancelar
                </button>
                <button type="submit" class="btn btn-success btn-sm">
                    <i class="fas fa-save me-1"></i> Guardar
                </button>
            </div>
        </form>
    </th:block>
</body>
</html>
