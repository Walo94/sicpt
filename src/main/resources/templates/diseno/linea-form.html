<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <!-- Contenido del modal (#modalContent). -->
    <th:block
      th:fragment="formulario"
      th:with="urlPost=${form.id == null} ? @{/diseno/lineas} : @{/diseno/lineas/{id}(id=${form.id})}"
    >
      <div class="modal-header modal-header-custom">
        <h5 class="modal-title">
          <i class="fas fa-grip-lines me-2"></i>
          <span th:text="${form.id == null} ? 'Nueva Linea' : 'Editar Linea'"
            >Nueva Linea</span
          >
        </h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="modal"
          aria-label="Cerrar"
        ></button>
      </div>

      <form
        th:object="${form}"
        th:attr="hx-post=${urlPost}"
        hx-target="#modalContent"
        hx-swap="innerHTML"
        hx-include="#buscador, #estadoTabla"
        novalidate
        autocomplete="off"
      >
        <div class="modal-body">
          <div class="mb-3">
            <label for="descripcion" class="form-label">
              Descripción <span class="text-danger">*</span>
            </label>
            <input
              type="text"
              class="form-control"
              th:field="*{descripcion}"
              th:errorclass="is-invalid"
              maxlength="100"
              placeholder="Ej. NAUTIC"
            />
            <div
              class="invalid-feedback"
              th:if="${#fields.hasErrors('descripcion')}"
              th:errors="*{descripcion}"
            ></div>
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary btn-sm"
            data-bs-dismiss="modal"
          >
            <i class="fas fa-times me-1"></i> Cancelar
          </button>
          <button type="submit" class="btn btn-success btn-sm">
            <i class="fas fa-save me-1"></i> Guardar
          </button>
        </div>
      </form>
    </th:block>
  </body>
</html>
