<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <th:block th:fragment="tabla">
      <div id="estadoTabla" hidden>
        <input type="hidden" name="page" th:value="${pagina.number}" />
        <input type="hidden" name="sort" th:value="${sort}" />
        <input type="hidden" name="dir" th:value="${dir}" />
      </div>

      <div class="text-muted small mb-1 text-end">
        <i class="fas fa-info-circle"></i> <span th:text="${pagina.totalElements}">0</span> registros
      </div>

      <div class="table-responsive catalogos-tabla-wrapper">
        <table class="table table-sm table-hover catalogos-tabla mb-0">
          <thead>
            <tr>
              <th style="width: 70px">#</th>
              <th style="width: 110px">Estatus</th>
              <th>Modelo</th>
              <th style="width: 100px">Versión</th>
              <th>Descripción</th>
              <th style="width: 140px">Fecha Creación</th>
              <th style="width: 140px">Última Modificación</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="d : ${pagina.content}" th:attr="data-id=${d.id},data-estatus=${d.estatus}">
              <td th:text="${d.id}"></td>
              <td>
                <span class="badge-estatus" th:classappend="${d.activo} ? 'badge-activo' : 'badge-inactivo'"
                  th:text="${d.activo} ? 'Activo' : 'Inactivo'"></span>
              </td>
              <td>
                <span class="badge-codigo" th:text="${d.modelo.codigoModelo}">9936</span>
                <span class="ms-1" th:text="${d.modelo.descripcion}">FLEXI RUNNER</span>
              </td>
              <td><span class="badge-talla" th:text="${'v' + d.version}">v1</span></td>
              <td th:text="${d.descripcion}"></td>
              <td th:text="${#temporals.format(d.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></td>
              <td th:text="${#temporals.format(d.fechaModificacion, 'dd/MM/yyyy HH:mm')}"></td>
            </tr>
            <tr th:if="${pagina.empty}">
              <td colspan="6" class="text-center text-muted py-4"><i class="fas fa-inbox fa-2x mb-2 d-block"></i> No
                hay registros</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div th:replace="~{fragments/paginador :: paginador(${pagina}, ${baseUrl}, ${qsSort}, '#tablaContainer')}"></div>
    </th:block>
  </body>
</html>
