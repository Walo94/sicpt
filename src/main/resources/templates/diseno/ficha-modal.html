<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

  <!-- MODAL INDIVIDUAL -->
  <th:block th:fragment="modalIndividual">
    <div class="modal-header modal-header-custom no-print">
      <h5 class="modal-title">
        <i class="fas fa-clipboard-list me-2"></i> Ficha Técnica
      </h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
    </div>
    <div class="modal-body bg-white" id="areaImpresion">
      <div th:replace="~{diseno/ficha-tecnica-fragmento :: fichaTabla(${modelo}, ${bom})}"></div>
    </div>
    <div class="modal-footer no-print">
      <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
      <button type="button" class="btn btn-primary btn-sm" onclick="imprimirFicha()">
        <i class="fas fa-print me-1"></i> Imprimir / Guardar PDF
      </button>
    </div>
  </th:block>

  <!-- MODAL MASIVO -->
  <th:block th:fragment="modalMasivo">
    <div class="modal-header modal-header-custom no-print">
      <h5 class="modal-title">
        <i class="fas fa-print me-2"></i> Reporte Masivo de Fichas Técnicas
      </h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
    </div>
    <div class="modal-body bg-white" id="areaImpresion">
      <div th:each="m : ${modelos}" class="ficha-page-break">
        <div th:replace="~{diseno/ficha-tecnica-fragmento :: fichaTabla(${m}, ${m.bomActivo})}"></div>
      </div>
    </div>
    <div class="modal-footer no-print">
      <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
      <button type="button" class="btn btn-primary btn-sm" onclick="imprimirFicha()">
        <i class="fas fa-print me-1"></i> Imprimir / Guardar PDF
      </button>
    </div>
  </th:block>

  <!-- Scripts específicos para la impresión del modal -->
  <script th:fragment="scripts">
    // En ficha-modal.html
    function imprimirFicha() {
      const contenido = document.getElementById('areaImpresion').innerHTML;

      const iframe = document.createElement('iframe');
      iframe.style.position = 'absolute';
      iframe.style.width = '0';
      iframe.style.height = '0';
      iframe.style.border = 'none';
      document.body.appendChild(iframe);

      const doc = iframe.contentWindow.document;
      doc.open();
      doc.write(`
    <html>
      <head>
        <title>Imprimir Ficha Técnica</title>
        <style>
          body { font-family: Arial, sans-serif; font-size: 12px; padding: 20px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
          .ficha-tabla { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
          .ficha-tabla th, .ficha-tabla td { border: 1px solid #000; padding: 6px; vertical-align: top; }
          .ficha-tabla .bg-gray { background-color: #f8f9fa; font-weight: bold; }
          .ficha-tabla .text-center { text-align: center; }
          .text-primary { color: #2c5f8a; }
          .table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
          .table th, .table td { padding: 0.5rem; border: 1px solid #dee2e6; }
          .table-light th { background-color: #f8f9fa; }
          .text-end { text-align: right; }
          .badge { padding: 3px 6px; border-radius: 4px; color: white; font-size: 10px; }
          .bg-success { background-color: #198754 !important; }
          .bg-warning { background-color: #ffc107 !important; color: black !important; }
          .alert-warning { background-color: #fff3cd !important; color: #664d03 !important; padding: 10px; border: 1px solid #ffecb5; }
          
          .ficha-page-break { page-break-after: always; }
          .ficha-page-break:last-child { page-break-after: auto; }
        </style>
      </head>
      <body>
        ${contenido}
      </body>
    </html>
  `);
      doc.close();

      // Esperamos un momento a que se carguen las imágenes
      setTimeout(() => {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
        setTimeout(() => document.body.removeChild(iframe), 1000);
      }, 500); // 500ms de espera
    }
  </script>
</body>

</html>
