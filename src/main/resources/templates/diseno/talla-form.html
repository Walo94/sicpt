<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <th:block
      th:fragment="formulario"
      th:with="urlPost=${form.id == null} ? @{/diseno/tallas} : @{/diseno/tallas/{id}(id=${form.id})}"
    >
      <div class="modal-header modal-header-custom">
        <h5 class="modal-title">
          <i class="fas fa-ruler me-2"></i>
          <span th:text="${form.id == null} ? 'Nueva Talla' : 'Editar Talla'"
            >Nueva Talla</span
          >
        </h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="modal"
          aria-label="Cerrar"
        ></button>
      </div>

      <form
        th:object="${form}"
        th:attr="hx-post=${urlPost}"
        hx-target="#modalContent"
        hx-swap="innerHTML"
        hx-include="#buscador, #estadoTabla"
        novalidate
        autocomplete="off"
        id="formTalla"
      >
        <div class="modal-body">
          <div class="mb-3">
            <label for="descripcion" class="form-label">
              Descripción <span class="text-danger">*</span>
            </label>
            <input
              type="text"
              class="form-control"
              th:field="*{descripcion}"
              th:errorclass="is-invalid"
              maxlength="100"
              placeholder="Ej. 22-26"
            />
            <div
              class="invalid-feedback"
              th:if="${#fields.hasErrors('descripcion')}"
              th:errors="*{descripcion}"
            ></div>
          </div>

          <div class="row g-3">
            <div class="col-6">
              <label for="puntoInicial" class="form-label">
                Punto inicial <span class="text-danger">*</span>
              </label>
              <input
                type="number"
                class="form-control"
                th:field="*{puntoInicial}"
                th:errorclass="is-invalid"
                step="0.5"
                min="0"
                placeholder="Ej. 22"
              />
              <div
                class="invalid-feedback"
                th:if="${#fields.hasErrors('puntoInicial')}"
                th:errors="*{puntoInicial}"
              ></div>
            </div>
            <div class="col-6">
              <label for="puntoFinal" class="form-label">
                Punto final <span class="text-danger">*</span>
              </label>
              <input
                type="number"
                class="form-control"
                th:field="*{puntoFinal}"
                th:errorclass="is-invalid"
                step="0.5"
                min="0"
                placeholder="Ej. 26"
              />
              <div
                class="invalid-feedback"
                th:if="${#fields.hasErrors('puntoFinal')}"
                th:errors="*{puntoFinal}"
              ></div>
            </div>
          </div>

          <div class="form-text mt-2">
            <i class="fas fa-info-circle me-1"></i>
            Se aceptan enteros y medios (ej. 22, 22.5). El punto final debe ser
            mayor que el inicial.
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">
            <i class="fas fa-times me-1"></i> Cancelar
          </button>
          <button type="submit" class="btn btn-success btn-sm">
            <i class="fas fa-save me-1"></i> Guardar
          </button>
        </div>
      </form>
    </th:block>
  </body>
</html>
